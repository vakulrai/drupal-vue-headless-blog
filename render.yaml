# Render Blueprint for the Drupal backend.
# Values marked "sync: false" are entered in the Render dashboard and never committed.
services:
  - type: web
    name: drupal-vue-headless-blog
    runtime: docker
    plan: free
    region: oregon
    dockerContext: ./drupal
    dockerfilePath: ./drupal/Dockerfile
    # Deploys are triggered by GitHub Actions after CI passes.
    autoDeploy: false
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA_PEM
        sync: false
      - key: DRUPAL_HASH_SALT
        generateValue: true
      - key: DRUPAL_ADMIN_USER
        value: admin
      - key: DRUPAL_ADMIN_PASS
        sync: false
      - key: DRUPAL_ADMIN_MAIL
        sync: false
      - key: DRUPAL_SITE_NAME
        value: Headless Blog
      - key: TRUSTED_HOST_PATTERNS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SAMESITE
        value: None
      - key: REVERSE_PROXY
        value: 'true'
